<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leonor — Portfolio</title>
  <meta name="description" content="Leonor's portfolio, as a small art collection.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Noto+Serif+Display:ital,wdth,wght@0,62.5,400;1,62.5,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wall-bg" id="wall-bg" aria-hidden="true"></div>
  <header class="nav">
    <a href="#gallery" class="overview-link" data-i18n="nav.overview">Overview</a>
    <a href="#intro" class="bar-logo"><img src="img/leonor.webp" alt="Leonor"></a>
    <div class="bar-right">
      <div class="actions">
        <button type="button" class="act" data-open="flyer"><span class="leaflet"><img src="img/leonor.webp" alt=""></span><span class="act-label" data-i18n="act.flyer">Flyer</span></button>
        <button type="button" class="act" data-open="contact"><img class="envelope" src="img/letter.webp" alt=""><span class="act-label" data-i18n="act.contact">Contact</span></button>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="pt">PT</button>
      </div>
    </div>
  </header>

  <!-- 1. Choose a language -->
  <section class="splash" id="splash" hidden>
    <button class="half en" data-pick="en"><span>english</span></button>
    <button class="half pt" data-pick="pt"><span>português</span></button>
  </section>

  <!-- 2. One continuous wall: opening text, the eight paintings, then the whole collection -->
  <div class="floor" aria-hidden="true"><div class="planks"></div></div>
  <section class="walk" id="walk" hidden>
    <div class="stop title-stop">
      <h1 class="title"><img id="title-img" src="img/title-en.webp" alt=""></h1>
      <button type="button" class="start" id="start" aria-label="Start"><svg viewBox="0 0 24 48" aria-hidden="true"><path d="M4 4l16 20L4 44"/></svg></button>
    </div>
    <div id="path"></div>
    <div class="stop end-stop">
      <div class="composition" id="composition"></div>
    </div>
  </section>
  <div class="room-light" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>

  <!-- A thin bar that fills as you walk the exhibition -->
  <div class="route" id="route" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span class="route-fill" id="route-fill"></span></div>

  <!-- Flyer and letter, opened from the top bar -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-card" id="sheet-card" role="dialog" aria-modal="true">
      <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">×</button>

      <div class="flyer-paper" data-sheet="flyer">
        <img src="img/leonor.webp" alt="Leonor">
        <p data-i18n="flyer.soon">The exhibition flyer is still at the printer's. In the meantime, the works:</p>
        <ol class="flyer-list" id="flyer-list"></ol>
      </div>

      <form class="letter" id="letter" data-sheet="contact">
        <!-- Web3Forms: troca pela tua access key (web3forms.com) -->
        <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_KEY">
        <input type="hidden" name="subject" value="New letter from the portfolio">
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
        <p class="salutation">Leonor,</p>
        <label><span data-i18n="mail.name">Your name</span><input name="name" required autocomplete="name"></label>
        <label><span data-i18n="mail.email">Your email</span><input name="email" type="email" required autocomplete="email"></label>
        <label><span data-i18n="mail.msg">Your message</span><textarea name="message" rows="5" required></textarea></label>
        <div class="seal-row">
          <button type="submit" class="seal" data-i18n="mail.send">Seal & send</button>
          <p class="status" id="letter-status" role="status"></p>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
