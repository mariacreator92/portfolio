<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leonor — Portfolio</title>
  <meta name="description" content="Leonor's portfolio, as a small art collection.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,700;1,400;1,500;1,700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="molding" aria-hidden="true"></div>

  <header class="nav">
    <a href="#gallery" class="logo">Leonor</a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="pt">PT</button>
    </div>
  </header>

  <!-- Screen 1: choose a language -->
  <section class="splash" id="splash" hidden>
    <p class="splash-name">Leonor</p>
    <button class="half" data-pick="en"><span class="big">English</span><span class="small">Enter the gallery</span></button>
    <button class="half" data-pick="pt"><span class="big">Português</span><span class="small">Entrar na galeria</span></button>
  </section>

  <!-- Screen 2: the entrance — the gallery seen from the door -->
  <section class="entrance" id="entrance" hidden>
    <div class="corridor" aria-hidden="true">
      <div class="hall" id="hall">
        <div class="w left" id="wall-left"></div>
        <div class="w right" id="wall-right"></div>
        <div class="w floor"></div>
        <div class="w ceiling"></div>
        <div class="w back"><span>Leonor</span></div>
      </div>
    </div>
    <div class="doors">
      <p class="welcome" data-i18n="e.welcome">Welcome. How would you like to visit?</p>
      <div class="door-row">
        <button class="door" data-mode="guided"><span class="big" data-i18n="e.guided">Guided tour</span><span class="small" data-i18n="e.guidedSub">The eight works, in order</span></button>
        <button class="door" data-mode="free"><span class="big" data-i18n="e.free">Wander freely</span><span class="small" data-i18n="e.freeSub">The whole collection, at your own pace</span></button>
      </div>
    </div>
  </section>

  <main>
    <!-- Gallery wall (free visit) -->
    <section class="gallery" id="gallery">
      <div class="title-row">
        <h1>Leonor</h1>
        <dl class="label">
          <dt data-i18n="g.exhibit">Exhibition:</dt><dd data-i18n="g.exhibitVal">Portfolio</dd>
          <dt data-i18n="g.works">Works:</dt><dd>08</dd>
        </dl>
      </div>
      <p class="hint" data-i18n="g.hint">Click a painting to step inside.</p>
      <div class="wall" id="wall"></div>
    </section>

    <!-- One room, filled in by app.js -->
    <article class="room" id="room" hidden>
      <div class="room-main">
        <figure class="painting"><img id="room-img" alt=""></figure>
        <div class="wall-text">
          <p class="room-label"><span data-i18n="room.label">Room</span> <span id="room-num"></span></p>
          <h2 id="room-title"></h2>
          <p class="medium" id="room-medium"></p>
          <p class="text" id="room-text"></p>
        </div>
      </div>
      <div id="room-extra"></div>
      <nav class="room-nav">
        <a href="#" id="prev"></a>
        <a href="#gallery" class="back" id="back"></a>
        <a href="#" id="next"></a>
      </nav>
    </article>
  </main>

  <footer>© 2026 Leonor</footer>

  <!-- ===== Extra content per room ===== -->

  <!-- 05 Inventory: objects → skills -->
  <template id="extra-inventory">
    <section class="extra">
      <h3 data-i18n="inv.title">Catalogue of objects</h3>
      <ul class="catalogue">
        <li><span class="obj" data-i18n="inv.o1">Passport</span><span class="dots"></span><span data-i18n="inv.s1">Languages · Portuguese & English</span></li>
        <li><span class="obj" data-i18n="inv.o2">Notebook & pen</span><span class="dots"></span><span data-i18n="inv.s2">Organisation & planning</span></li>
        <li><span class="obj" data-i18n="inv.o3">Colour swatches</span><span class="dots"></span><span data-i18n="inv.s3">Visual sense & design</span></li>
        <li><span class="obj" data-i18n="inv.o4">Phone</span><span class="dots"></span><span data-i18n="inv.s4">Social media & content</span></li>
        <li><span class="obj" data-i18n="inv.o5">Earphones</span><span class="dots"></span><span data-i18n="inv.s5">Listening & communication</span></li>
        <li><span class="obj" data-i18n="inv.o6">Watch</span><span class="dots"></span><span data-i18n="inv.s6">Time management</span></li>
      </ul>
    </section>
  </template>

  <!-- 06 Craft: chest of drawers → platforms -->
  <template id="extra-craft">
    <section class="extra">
      <h3 data-i18n="craft.title">Open a drawer</h3>
      <div class="chest">
        <button class="drawer" aria-expanded="false"><span class="knob"></span><span class="tool"><img src="https://cdn.jsdelivr.net/npm/simple-icons@11.0.0/icons/figma.svg" alt="">Figma</span></button>
        <button class="drawer" aria-expanded="false"><span class="knob"></span><span class="tool"><img src="https://cdn.jsdelivr.net/npm/simple-icons@11.0.0/icons/canva.svg" alt="">Canva</span></button>
        <button class="drawer" aria-expanded="false"><span class="knob"></span><span class="tool"><img src="https://cdn.jsdelivr.net/npm/simple-icons@11.0.0/icons/notion.svg" alt="">Notion</span></button>
        <button class="drawer" aria-expanded="false"><span class="knob"></span><span class="tool"><img src="https://cdn.jsdelivr.net/npm/simple-icons@11.0.0/icons/instagram.svg" alt="">Instagram</span></button>
        <button class="drawer" aria-expanded="false"><span class="knob"></span><span class="tool"><img src="https://cdn.jsdelivr.net/npm/simple-icons@11.0.0/icons/tiktok.svg" alt="">TikTok</span></button>
        <button class="drawer" aria-expanded="false"><span class="knob"></span><span class="tool"><img src="https://cdn.jsdelivr.net/npm/simple-icons@11.0.0/icons/googledrive.svg" alt="">Google Drive</span></button>
      </div>
    </section>
  </template>

  <!-- 07 Personal Library: books → CV -->
  <template id="extra-library">
    <section class="extra">
      <h3 data-i18n="lib.title">Take a book from the shelf</h3>
      <div class="shelf">
        <div class="books">
          <button class="book c1" data-detail="edu"><span>Lusófona University</span></button>
          <button class="book c2 thin" data-detail="edu"><span>Católica University</span></button>
          <button class="book c3" data-detail="edu"><span>East Stroudsburg University</span></button>
        </div>
        <div class="bookend" aria-hidden="true"></div>
        <div class="books">
          <button class="book c4" data-detail="work"><span>Tony Castro Yachts</span></button>
          <button class="book c2" data-detail="work"><span>Super Luxury Group</span></button>
          <button class="book c5" data-detail="work"><span>Warriors Athletics</span></button>
          <button class="book c6" data-detail="work"><span>The Adecco Group</span></button>
          <button class="book c3 thin" data-detail="work"><span>Pantalha Lda</span></button>
          <button class="book c4 thin" data-detail="work"><span>FNAC Portugal</span></button>
          <button class="book c3" data-detail="work"><span>Volleyball Club</span></button>
          <button class="book c6 thin" data-detail="work"><span>Summer Camp</span></button>
        </div>
      </div>
      <div class="book-open" id="book-open" hidden>
        <p class="kind" id="book-kind"></p>
        <h4 id="book-name"></h4>
        <p data-i18n="lib.placeholder">Role · years — a line or two about what you did here.</p>
      </div>
      <div class="cv-links">
        <a href="#" class="gold-btn" data-i18n="lib.cv">Full résumé (PDF)</a>
        <a href="#" class="gold-btn ghost">LinkedIn ↗</a>
      </div>
    </section>
  </template>

  <!-- 08 Correspondence: contact form -->
  <template id="extra-correspondence">
    <section class="extra">
      <h3 data-i18n="mail.title">Write her a letter</h3>
      <form class="letter" id="letter">
        <!-- Web3Forms: troca pela tua access key (web3forms.com) -->
        <input type="hidden" name="access_key" value="YOUR_WEB3FORMS_KEY">
        <input type="hidden" name="subject" value="New letter from the portfolio">
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off">
        <p class="salutation" data-i18n="mail.dear">Dear Leonor,</p>
        <label><span data-i18n="mail.name">Your name</span><input name="name" required autocomplete="name"></label>
        <label><span data-i18n="mail.email">Your email</span><input name="email" type="email" required autocomplete="email"></label>
        <label><span data-i18n="mail.msg">Your message</span><textarea name="message" rows="6" required></textarea></label>
        <div class="seal-row">
          <button type="submit" class="seal" data-i18n="mail.send">Seal & send</button>
          <p class="status" id="letter-status" role="status"></p>
        </div>
      </form>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
